<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Curiosity Passport | Your curiosity is your experience</title>
    <meta name="description" content="A public portfolio platform where students showcase curiosity, independent learning, questions explored, discoveries made, and projects completed." />
    
    <!-- Google Fonts: Editorial Serif + Clean Modern Sans + Monospace Stamp -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%231B382B'/><circle cx='16' cy='16' r='12' fill='none' stroke='%23C29B38' stroke-width='1.5'/><polygon points='16,7 19,16 16,13 13,16' fill='%23FAF7F0'/><polygon points='16,25 19,16 16,19 13,16' fill='%23C29B38'/></svg>" />
    <!-- Apply the saved theme before first paint to avoid a flash of the wrong mode -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('curiosity-passport-theme');
          var theme = saved === 'light' || saved === 'dark'
            ? saved
            : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
